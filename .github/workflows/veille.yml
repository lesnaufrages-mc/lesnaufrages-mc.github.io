# « Le 7e Thomas » : chaque matin, vérifie le site et les réserves de contenu (scripts/veille.cjs).
# Le rapport est tenu à jour dans une seule issue « Rapport de veille ».
# Un commentaire (donc une notification GitHub) n'est ajouté que si la liste des problèmes change.
name: Veille du matin

on:
  schedule:
    - cron: '17 5 * * *' # 6h17 en hiver, 7h17 en été (heure belge)
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: rapport
        run: node scripts/veille.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@v7
        env:
          EMPREINTE: ${{ steps.rapport.outputs.empreinte }}
          PROBLEMES: ${{ steps.rapport.outputs.problemes }}
        with:
          script: |
            const fs = require('fs');
            const rapport = fs.readFileSync('rapport-veille.md', 'utf8');
            const marque = `<!-- veille:${process.env.EMPREINTE} -->`;
            const corps = rapport + '\n' + marque;
            const { owner, repo } = context.repo;
            const ouvertes = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'veille', per_page: 5 });
            const issue = ouvertes.data[0];
            if (!issue) {
              await github.rest.issues.create({ owner, repo, title: 'Rapport de veille', body: corps, labels: ['veille'] });
              return;
            }
            const avant = (issue.body || '').match(/<!-- veille:(.*?) -->/);
            await github.rest.issues.update({ owner, repo, issue_number: issue.number, body: corps });
            const change = !avant || avant[1] !== process.env.EMPREINTE;
            if (change && Number(process.env.PROBLEMES) > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: rapport });
            }
