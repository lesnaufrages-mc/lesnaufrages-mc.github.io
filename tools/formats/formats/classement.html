<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Format classement</title>
<script src="../moteur/commun.js"></script>
</head><body><div id="scene"></div>
<script>
// FORMAT « CLASSEMENT » (infographie) : top N révélé du dernier au premier, barres qui poussent,
// puis un « bonus » (la surprise) et la carte de fin.
// DATA = { accroche, titre, unite, decimales, items:[{nom, valeur, detail}] (rang 1 en premier),
//          bonus:{nom, valeur, detail, texte}, question, appel, source }
const D = window.DATA || {}; const N = D.items.length; const DEC = D.decimales ?? 0;
const T_INTRO = 3.2, T_ITEM = 2.6, T_BONUS = D.bonus ? 4.5 : 0, T_FIN = 3.5;
const T_LISTE = T_INTRO, T_BONUS0 = T_LISTE + N * T_ITEM, T_FIN0 = T_BONUS0 + T_BONUS;
window.DURATION = T_FIN0 + T_FIN;
const MAX = Math.max(...D.items.map((i) => i.valeur), D.bonus ? D.bonus.valeur : 0);
K.base(D);
const sc = document.getElementById('scene');

// intro
const intro = K.el('div', 'abs'); intro.style.cssText = 'left:70px;right:70px;top:560px;text-align:center';
intro.innerHTML = `<div class="titre" id="acc" style="font-size:92px;line-height:1.1;color:var(--or2)"></div>
  <div id="sous" style="margin-top:44px;font-size:44px;color:var(--texte)">${K.esc(D.titre)}</div>`;
const acc = intro.querySelector('#acc'), sous = intro.querySelector('#sous');

// en-tête (après l'intro)
const tete = K.el('div', 'abs titre'); tete.style.cssText = 'left:60px;right:60px;top:110px;text-align:center;font-size:52px;line-height:1.15;color:var(--or2)';
tete.textContent = D.titre;
const unite = K.el('div', 'abs'); unite.style.cssText = 'left:0;right:0;top:250px;text-align:center;font-size:30px;color:var(--doux)';
unite.textContent = D.unite ? 'en ' + D.unite : '';

// lignes : rang 1 en haut
const TOP = 330, H = 118, BARX = 300, BARW = 700;
const rows = D.items.map((it, i) => {
  const r = K.el('div', 'abs'); r.style.cssText = `left:40px;right:40px;top:${TOP + i * H}px;height:${H - 16}px`;
  r.innerHTML = `<div class="titre" style="position:absolute;left:0;top:14px;width:90px;text-align:center;font-size:56px;color:var(--or)">${i + 1}</div>
    <div class="nom" style="position:absolute;left:100px;top:4px;width:900px;font-size:38px;font-weight:700;white-space:nowrap">${K.esc(it.nom)}
      <span style="font-weight:400;font-size:28px;color:var(--doux)">&nbsp;${K.esc(it.detail || '')}</span></div>
    <div class="barre" style="position:absolute;left:100px;top:58px;height:34px;border-radius:17px;background:linear-gradient(90deg,#b8862c,var(--or2))"></div>
    <div class="val" style="position:absolute;top:56px;font-size:32px;font-weight:800;color:var(--texte)"></div>`;
  return { r, it, barre: r.querySelector('.barre'), val: r.querySelector('.val') };
});

// gros rang au centre pendant la révélation
const gros = K.el('div', 'abs titre'); gros.style.cssText = 'left:0;right:0;top:300px;text-align:center;font-size:420px;color:rgba(232,184,74,.10);pointer-events:none';

// bonus
let bon;
if (D.bonus) {
  bon = K.el('div', 'abs'); bon.style.cssText = `left:40px;right:40px;top:${TOP + N * H + 20}px;padding:22px 26px;border:4px dashed var(--rouge);border-radius:26px;background:rgba(224,86,63,.10)`;
  bon.innerHTML = `<div style="font-size:38px;font-weight:800">${K.esc(D.bonus.nom)} <span style="font-weight:400;font-size:28px;color:var(--doux)">${K.esc(D.bonus.detail || '')}</span></div>
    <div style="position:relative;height:40px;margin-top:10px"><div class="barre" style="position:absolute;left:0;top:3px;height:34px;border-radius:17px;background:var(--rouge)"></div>
    <div class="val" style="position:absolute;top:0;font-size:32px;font-weight:800"></div></div>
    <div class="txt" style="margin-top:12px;font-size:34px;color:var(--or2);font-weight:700"></div>`;
}

window.render = function (t) {
  // intro
  const xi = K.p(t, 0, T_INTRO - .4), xo = K.p(t, T_INTRO - .4, T_INTRO);
  intro.style.opacity = 1 - xo; intro.style.transform = `translateY(${-60 * xo}px)`;
  acc.textContent = K.tape(D.accroche || '', K.p(t, .1, 1.4)); sous.style.opacity = K.p(t, 1.4, 1.9);
  const xh = K.easeOut(K.p(t, T_INTRO - .3, T_INTRO + .3));
  tete.style.opacity = xh; unite.style.opacity = xh; tete.style.transform = `translateY(${30 * (1 - xh)}px)`;

  // lignes : on révèle le rang N d'abord
  let courant = -1;
  rows.forEach((o, i) => {
    const k = N - 1 - i; const t0 = T_LISTE + k * T_ITEM; // instant d'arrivée de ce rang
    const a = K.p(t, t0, t0 + .45), g = K.easeOut(K.p(t, t0 + .25, t0 + 1.5));
    o.r.style.opacity = a; o.r.style.transform = `translateX(${(1 - K.easeOut(a)) * 120}px)`;
    const w = Math.max(34, BARW * (o.it.valeur / MAX) * g); o.barre.style.width = w + 'px';
    o.val.style.left = (100 + w + 16) + 'px'; o.val.textContent = K.nombre(o.it.valeur * g, DEC);
    const actif = t >= t0 && t < t0 + T_ITEM && t < T_BONUS0; if (actif) courant = i;
    o.r.style.filter = (t >= T_LISTE && t < T_BONUS0 && !actif && a > 0) ? 'brightness(.65)' : 'none';
    o.r.querySelector('.nom').style.color = actif ? 'var(--or2)' : 'var(--texte)';
  });
  if (courant >= 0) { const t0 = T_LISTE + (N - 1 - courant) * T_ITEM; const x = K.p(t, t0, t0 + .4); gros.textContent = '#' + (courant + 1); gros.style.opacity = x; gros.style.transform = `scale(${1.25 - .25 * K.back(x)})`; }
  else gros.style.opacity = 0;

  // bonus
  if (bon) {
    const a = K.p(t, T_BONUS0, T_BONUS0 + .5), g = K.easeOut(K.p(t, T_BONUS0 + .3, T_BONUS0 + 1.6));
    bon.style.opacity = a; bon.style.transform = `scale(${1.15 - .15 * K.back(a)})`;
    const w = Math.max(34, BARW * (D.bonus.valeur / MAX) * g); const b = bon.querySelector('.barre'), v = bon.querySelector('.val');
    b.style.width = w + 'px'; v.style.left = (w + 16) + 'px'; v.textContent = K.nombre(D.bonus.valeur * g, DEC);
    bon.querySelector('.txt').textContent = K.tape(D.bonus.texte || '', K.p(t, T_BONUS0 + 1.6, T_BONUS0 + 3.2));
  }
  // fin
  if (t >= T_FIN0) K.fin(t, T_FIN0, D); else { const f = document.getElementById('kfin'); if (f) f.style.opacity = 0; }
};

window.EVENTS = function () {
  const e = [{ t: 0, type: 'whoosh' }, { t: T_INTRO - .2, type: 'whoosh' }];
  for (let k = 0; k < N; k++) e.push({ t: T_LISTE + k * T_ITEM, type: k === N - 1 ? 'impact' : 'tick' });
  if (D.bonus) e.push({ t: T_BONUS0, type: 'impact' });
  e.push({ t: T_FIN0, type: 'fin' });
  return e;
};
</script></body></html>
