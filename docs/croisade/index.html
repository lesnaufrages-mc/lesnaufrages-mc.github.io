<style>
/* Police Cinzel hébergée sur le site (licence SIL OFL), partagée avec Imperium of Wars */
@font-face{font-family:'Cinzel';font-style:normal;font-weight:700 900;font-display:swap;src:url(../strategie/polices/cinzel-latin.woff2) format('woff2')}
:root{
  --bg:#0d0c0a;--bg2:#15120e;--card:#1e1a14;--line:#3b3224;--txt:#ece4d3;--muted:#a89d88;
  --or:#c9a24a;--or2:#e6cf8f;--rouge:#9b1c1c;--vert:#4d8b46;--bleu:#3d5a80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hide{display:none!important}
.ecran{position:fixed;inset:0}
.muted{color:var(--muted)}
.or{color:var(--or2)}
.rouge{color:#e57373}
.grand{font-size:20px;font-weight:700}
kbd{display:inline-block;padding:1px 6px;border:1px solid #5a4c34;border-bottom-width:3px;border-radius:4px;background:#26211a;font:600 12px/1.4 system-ui;color:var(--or2)}
.btn{display:block;width:100%;max-width:360px;margin:8px auto;padding:13px 16px;border-radius:4px;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:15px;letter-spacing:.03em;background:linear-gradient(180deg,#26211a,#17140f);border:1px solid #4a3e2a;text-align:center}
.btn:hover:not([disabled]){border-color:var(--or)}
.btn:active:not([disabled]){transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.or{background:linear-gradient(180deg,#c9a24a,#8e6b26);color:#140e05;border-color:#e6cf8f;box-shadow:0 3px 0 #4a3510}
.btn.rouge{background:linear-gradient(180deg,#8f1b1b,#5e1010);border-color:#b33a3a;color:#fff}
.btn.petit{display:inline-block;width:auto;margin:4px;padding:8px 12px;font-size:13px}
.btn.actif{border-color:var(--or);color:var(--or2);box-shadow:inset 0 0 0 1px var(--or)}
.rangee{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;background:#3b3224;color:var(--or2);font-weight:600}
.tag.or{background:var(--or);color:#140e05}
.pastille{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid #000;vertical-align:middle}

/* Accueil */
#accueil{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;text-align:center;overflow:auto;
  background:radial-gradient(ellipse 70% 55% at 50% 30%,#2a2116,transparent 75%),repeating-linear-gradient(45deg,#100e0b 0 14px,#0d0c0a 14px 28px)}
#accueil::before{content:"";position:absolute;inset:12px;border:1px solid var(--line);outline:1px solid #241f17;outline-offset:5px;pointer-events:none}
#accueil>*{position:relative}
.titre{font-family:Cinzel,Georgia,serif;font-size:clamp(38px,11vw,72px);margin:0;letter-spacing:.12em;font-weight:900;line-height:1;color:#efe6d1;text-shadow:0 3px 0 #000,0 0 40px rgba(201,162,74,.25)}
.sousTitre{font-family:Cinzel,Georgia,serif;color:var(--or);letter-spacing:.28em;font-size:clamp(11px,3vw,15px);margin:10px 0 4px;text-transform:uppercase}
.trad{color:var(--muted);font-style:italic;margin:2px 0 18px;font-size:14px}
.demo{display:inline-block;margin-bottom:16px;padding:3px 10px;border:1px solid var(--or);color:var(--or2);border-radius:12px;font-size:12px;font-weight:700;letter-spacing:.08em}
.blason{width:96px;height:96px;margin:6px auto 4px}
.options{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;margin:14px 0 6px;font-size:14px;color:var(--muted);max-width:420px}
.options label{display:flex;align-items:center;gap:6px}
.options select{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:4px}
.lienSite{margin-top:14px;font-size:13px}
.lienSite a{color:var(--muted)}

/* Création */
#creation{display:flex;flex-direction:column;align-items:center;padding:24px 16px;overflow:auto;background:var(--bg)}
#creation h2{font-family:Cinzel,Georgia,serif;margin:6px 0 14px;text-align:center}
.factions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:560px}
.carteFaction{padding:14px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);text-align:center}
.carteFaction.actif{border-color:var(--or);box-shadow:0 0 0 1px var(--or),0 6px 20px rgba(201,162,74,.15)}
.carteFaction .ico{font-size:36px}
.carteFaction b{display:block;font-family:Cinzel,Georgia,serif;margin-top:4px}
.carteFaction small{color:var(--muted)}
#detailFaction{max-width:560px;font-size:14px;line-height:1.45;margin:12px 0}
#detailFaction ul{padding-left:18px}
.champ{display:block;width:100%;max-width:360px;margin:6px auto;padding:12px;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:700 17px system-ui;text-align:center}

/* Carte */
#carte{background:#1d3c55}
#carteCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.barre{position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:linear-gradient(180deg,rgba(13,12,10,.95),rgba(13,12,10,.75));border-bottom:1px solid var(--line);font-size:13px;z-index:2}
.barre span{white-space:nowrap;padding:3px 7px;background:#1e1a14;border:1px solid #3b3224;border-radius:4px}
.barre .esp{flex:1;background:none;border:0;padding:0}
.barre button{padding:5px 9px;border:1px solid #4a3e2a;border-radius:4px;background:#1e1a14;font-size:13px}
.barre button:hover{border-color:var(--or)}
#barreObjectif{position:absolute;left:50%;transform:translateX(-50%);top:52px;max-width:92vw;padding:6px 12px;border-radius:14px;background:rgba(30,26,20,.92);border:1px solid var(--or);color:var(--or2);font-size:13px;font-weight:600;z-index:2;cursor:pointer;text-align:center}
.zoom{position:absolute;right:10px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:40px;height:40px;border-radius:50%;background:#1e1a14;border:1px solid #4a3e2a;font-size:18px}
#panneauLieu{position:absolute;left:10px;bottom:12px;width:min(380px,calc(100vw - 70px));max-height:60vh;overflow:auto;padding:12px 14px;background:rgba(21,18,14,.97);border:1px solid var(--or);border-radius:6px;z-index:3;font-size:14px;line-height:1.4}
#panneauLieu p{margin:6px 0}
.lieuTete{display:flex;gap:10px;align-items:center}
.lieuTete b{font-family:Cinzel,Georgia,serif;font-size:18px;display:block}
.lieuTete small{color:var(--muted)}
.objectif{color:var(--or2);font-weight:600}
.legende{color:#f7dc6f}

/* 3D */
#jeu3d{background:#000}
#vue3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#zoneTactile{position:absolute;inset:0;display:none}
.tactile #zoneTactile{display:block}
#calqueTextes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.flottant{position:absolute;left:0;top:0;font:900 18px/1 system-ui;color:#fff;text-shadow:0 2px 0 #000,0 0 4px #000;white-space:nowrap}
.flottant.rouge{color:#ff6b6b}.flottant.or{color:#f7dc6f;font-size:20px}.flottant.vert{color:#7dcea0}.flottant.gris{color:#ccc;font-size:14px}.flottant.petit{font-size:12px;color:#ddd}
.barreTete{position:absolute;left:0;top:0;width:46px;height:5px;background:rgba(0,0,0,.6);border:1px solid rgba(0,0,0,.8);border-radius:2px}
.barreTete i{display:block;height:100%;background:#e74c3c}
.barreTete.allie i{background:#5dade2}
.barreTete.boss{display:none}
.barreTete span{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font:700 11px system-ui;color:#aed6f1;white-space:nowrap;text-shadow:0 1px 2px #000}
.barreTete b{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font:900 22px/1 system-ui;color:#ff5252;text-shadow:0 0 6px #000,0 2px 0 #000}
.barreTete.menace{outline:2px solid #ff5252}
.barreTete.navire{width:80px;height:7px}
.etiquette{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;text-shadow:0 1px 3px #000,0 0 2px #000}
.bulle{position:absolute;left:0;top:0;max-width:220px;padding:5px 9px;border-radius:10px;background:rgba(253,250,240,.93);color:#2b2118;font:600 12px/1.3 system-ui;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:opacity .3s;white-space:normal;width:max-content}
.bulle::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:rgba(253,250,240,.93)}
.etiquette span{display:block;font-size:20px}
.etiquette b{display:block;font:700 13px Cinzel,Georgia,serif;color:#f7dc6f}
.etiquette i{display:block;font:600 11px system-ui;color:#eee;font-style:normal}
.hud{position:absolute;pointer-events:none}
#hudHaut{left:10px;top:10px;width:min(300px,52vw)}
.jauge{height:14px;background:rgba(0,0,0,.6);border:1px solid #000;border-radius:3px;overflow:hidden;position:relative;margin-bottom:4px}
.jauge i{display:block;height:100%;transition:width .12s}
#hudPv{background:linear-gradient(180deg,#e74c3c,#922b21)}
#hudEnd{background:linear-gradient(180deg,#f4d03f,#b7950b)}
#hudPvTxt{position:absolute;inset:0;font:700 10px/14px system-ui;text-align:center;text-shadow:0 1px 1px #000}
.jauge.fine{height:7px}
#hudArme{font:700 13px Cinzel,Georgia,serif;color:var(--or2);text-shadow:0 1px 2px #000;margin-top:2px}
#hudPouvoir{position:absolute;right:12px;bottom:200px;width:58px;height:58px;border-radius:50%;border:2px solid var(--or);background:conic-gradient(rgba(0,0,0,.75) calc(var(--k,0)*360deg),rgba(201,162,74,.35) 0);display:flex;align-items:center;justify-content:center;font-size:24px;text-align:center}
#hudPouvoir.pret{box-shadow:0 0 16px var(--or)}
#hudPouvoirNom{position:absolute;top:62px;left:50%;transform:translateX(-50%);font:700 10px system-ui;white-space:nowrap;color:var(--or2);text-shadow:0 1px 2px #000}
.pc #hudPouvoir{bottom:24px;right:24px}
#hudInfos{right:10px;top:10px;text-align:right;font:700 13px system-ui;text-shadow:0 1px 2px #000}
#hudInfos div{margin-bottom:4px}
#nomLieu3d{font-family:Cinzel,Georgia,serif;color:var(--or2)}
#hudBoss{left:50%;top:44px;transform:translateX(-50%);width:min(520px,80vw);text-align:center}
#hudBossNom{font:700 15px Cinzel,Georgia,serif;color:#f5b7b1;text-shadow:0 1px 3px #000;margin-bottom:3px}
#hudBossPv{background:linear-gradient(180deg,#c0392b,#641e16)}
.hudMsg{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%) scale(.9);opacity:0;transition:all .25s;font:900 clamp(22px,5vw,36px) Cinzel,Georgia,serif;color:#fff;text-shadow:0 3px 0 #000,0 0 18px #000;pointer-events:none;text-align:center;white-space:nowrap}
.hudMsg.montre{opacity:1;transform:translate(-50%,-50%) scale(1)}
.hudMsg.or{color:#f7dc6f}.hudMsg.rouge{color:#ff6b6b}.hudMsg.boss{color:#f5b7b1}.hudMsg.petit{font-size:16px;top:24%}
/* Indicateur de direction (Mount & Blade) */
.hudDir{position:absolute;left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%);pointer-events:none;opacity:.8}
.hudDir::before,.hudDir::after{content:"";position:absolute;inset:0}
.hudDir::before{border:2px solid rgba(255,255,255,.25);border-radius:50%}
.hudDir::after{width:0;height:0;margin:auto;border:10px solid transparent}
.hudDir.d-haut::after{border-bottom-color:#fff;top:-6px;bottom:auto}
.hudDir.d-estoc::after{border:6px solid #fff;border-radius:50%;width:0;height:0}
.hudDir.d-gauche::after{border-right-color:#fff;left:-6px;right:auto}
.hudDir.d-droite::after{border-left-color:#fff;right:-6px;left:auto}
.hudDir.bloc::before{border-color:#5dade2}
.hudDir.bloc::after{filter:hue-rotate(0)}
.hudDir.bloc.d-haut::after{border-bottom-color:#5dade2}.hudDir.bloc.d-gauche::after{border-right-color:#5dade2}.hudDir.bloc.d-droite::after{border-left-color:#5dade2}.hudDir.bloc.d-estoc::after{border-color:#5dade2}
#hudOrdres{left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
#hudOrdres button{padding:6px 9px;border-radius:4px;background:rgba(21,18,14,.85);border:1px solid #4a3e2a;font-size:12px}
#hudOrdres button.actif{border-color:var(--or);color:var(--or2)}
.tactile #hudOrdres{bottom:auto;top:62px}
#hudNaval{left:10px;top:10px;width:min(300px,55vw)}
#hudNavPv{background:linear-gradient(180deg,#5dade2,#1b4f72)}
#hudNavTxt,#hudNavEquipage{font:700 12px system-ui;text-shadow:0 1px 2px #000;margin-bottom:3px}
.cooldowns{display:flex;gap:8px;margin-top:6px}
.cd{width:46px;height:46px;border-radius:50%;border:2px solid var(--or);background:conic-gradient(rgba(0,0,0,.75) calc(var(--k,0)*360deg),rgba(201,162,74,.35) 0);display:flex;align-items:center;justify-content:center;font-size:20px}
#hudNavJauge{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:14px;height:120px;background:rgba(0,0,0,.6);border:1px solid #000;border-radius:3px;display:flex;align-items:flex-end}
#hudNavGaz{width:100%;background:linear-gradient(0deg,#d6eaf8,#5dade2)}
.modeNaval .terre,body:not(.modeNaval) .mer{display:none!important}
.modeVille .combat{display:none!important}
body:not(.modeVille) .villeSeul{display:none!important}
#invite{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);padding:8px 14px;border-radius:16px;background:rgba(21,18,14,.9);border:1px solid var(--or);font-size:14px;pointer-events:none;white-space:nowrap}
#btnPause{position:absolute;right:10px;top:72px;width:40px;height:40px;border-radius:50%;background:rgba(21,18,14,.85);border:1px solid #4a3e2a;font-size:16px;pointer-events:auto}
/* Commandes tactiles */
.tactileSeul{display:none}
.tactile .tactileSeul{display:block}
#joySocle{position:absolute;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.2);display:none;pointer-events:none}
#joyBouton{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.35)}
#boutonsTactiles{position:absolute;right:10px;bottom:16px;width:200px;height:190px;pointer-events:none}
#boutonsTactiles button{position:absolute;width:62px;height:62px;border-radius:50%;background:rgba(21,18,14,.75);border:2px solid rgba(201,162,74,.7);font-size:24px;pointer-events:auto;touch-action:none}
#boutonsTactiles button.appui{background:rgba(201,162,74,.5)}
#boutonsTactiles .gros{width:80px;height:80px;font-size:32px;right:0;bottom:0}
#bBloc{right:88px;bottom:0}
#bEsquive{right:0;bottom:88px}
#bCourir{right:150px;bottom:70px;width:50px!important;height:50px!important;font-size:18px!important}
#bChanger{right:84px;bottom:76px;width:50px!important;height:50px!important;font-size:18px!important}
#bOrdre{right:140px;bottom:132px;width:46px!important;height:46px!important;font-size:16px!important}
.tactile #hudPouvoir{pointer-events:auto;bottom:220px;right:18px}

/* Dialogue */
#dialogue{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px;display:flex;justify-content:center;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent)}
.dlgBoite{position:relative;width:min(760px,100%);display:flex;gap:12px;padding:14px;background:#15120e;border:1px solid var(--or);border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.7)}
#dlgPortrait canvas{width:84px;height:84px;border:2px solid var(--line);border-radius:4px;image-rendering:pixelated}
#dialogue.narration #dlgPortrait{display:none}
#dialogue.narration #dlgTexte{font-style:italic;color:#e8dcc0}
.dlgDroite{flex:1;min-width:0}
#dlgNom{font:700 15px Cinzel,Georgia,serif;color:var(--or2);margin-bottom:4px;min-height:4px}
#dlgTexte{font-size:16px;line-height:1.45;min-height:46px}
#dlgSuite{position:absolute;right:12px;bottom:6px;font-size:12px;color:var(--muted);animation:clignote 1.2s infinite}
@keyframes clignote{50%{opacity:.3}}
#dlgChoix{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.choix{text-align:left;padding:10px 12px;border:1px solid #4a3e2a;border-radius:4px;background:#1e1a14;font-size:15px}
.choix:hover{border-color:var(--or);color:var(--or2)}
.choix::before{content:"➤ ";color:var(--or)}

/* Fenêtre */
#fenetre{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(0,0,0,.6)}
.fenBoite{width:min(640px,100%);max-height:90vh;display:flex;flex-direction:column;background:#15120e;border:1px solid var(--or);border-radius:6px;box-shadow:0 10px 50px rgba(0,0,0,.8)}
.fenTete{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
#fenTitre{font:700 18px Cinzel,Georgia,serif;color:var(--or2);margin:0}
#fenFermer{font-size:22px;padding:2px 8px}
#fenCorps{padding:12px 14px;overflow:auto;font-size:14px;line-height:1.45;user-select:text;-webkit-user-select:text}
#fenCorps h3{font-family:Cinzel,Georgia,serif;color:var(--or2);font-size:15px;margin:14px 0 6px}
#fenCorps details{margin:8px 0;padding:8px;border:1px dashed var(--line);border-radius:4px}
#fenCorps summary{cursor:pointer;color:var(--or2);font-weight:600}
.date{color:var(--or);font-weight:700}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.carteArme{padding:10px;border:1px solid var(--line);border-radius:5px;background:var(--card)}
.carteArme.leg{border-color:#b7950b;background:linear-gradient(180deg,#2a2314,#1e1a14)}
.carteArme b{display:block;font-family:Cinzel,Georgia,serif}
.carteArme small{color:var(--muted)}
.carteArme p{font-size:12px;margin:6px 0}
.stats label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.stats label span{flex:1;height:5px;background:#000;border-radius:3px;overflow:hidden}
.stats label i{display:block;height:100%;background:var(--or)}
.liste{display:flex;flex-direction:column;gap:6px}
.boutons{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.boutons .btn{width:auto;margin:0}
#fenCorps h3 + .boutons,#fenCorps .boutons + .boutons{margin:6px 0;justify-content:flex-start}
.ligneUnite{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--card)}
.ligneUnite small{display:block;color:var(--muted);font-size:12px}
.ligneCour{display:flex;gap:10px;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--card)}
.ligneCour canvas{width:64px;height:64px;flex:none;border:1px solid var(--line);image-rendering:pixelated}
.ligneCour small{display:block;color:var(--muted)}
.ligneCour p{margin:4px 0;font-size:13px}
.statsHeros{display:flex;gap:12px;align-items:center}
.statsHeros canvas{width:72px;height:72px;border:2px solid var(--or);image-rendering:pixelated}
.statsHeros small{display:block;color:var(--muted)}
.statsHeros p{margin:3px 0}
.chapitres li{margin:3px 0}
.chapitres li.fait{color:var(--muted);text-decoration:line-through}
.chapitres li.encours{color:var(--or2);font-weight:700}
.chapitres small{color:var(--muted)}
.codexLigne{padding:8px;border-bottom:1px solid var(--line)}
@media (max-width:640px){#bCompagnie span,#bDiplo span,#bJournal span,#bCodex span{display:none}}
.guerre{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin:4px 0}.guerre b{color:#ff6b6b;font-size:12px}.guerre small{flex-basis:100%;color:var(--muted)}
.nouvelles{margin:4px 0 8px;padding-left:18px}.nouvelles li{margin:3px 0}.nouvelles small{color:var(--muted);margin-right:4px}
.ligneUnite.diplo>div:last-child{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.codexLigne.leg b{color:#f7dc6f}
.codexLigne small{display:block;color:var(--muted)}
.codexLigne p{margin:4px 0}
.onglets{display:flex;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.recomp p{font-size:16px;margin:8px 0}
.recomp .arme{padding:10px;border:1px solid #b7950b;border-radius:4px;background:#2a2314}
.epilogue p{font-size:15px}
.touches li{margin:6px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;transition:all .3s;z-index:40;max-width:92vw;padding:9px 16px;border-radius:18px;background:#1e1a14;border:1px solid var(--or);font-size:14px;pointer-events:none;text-align:center}
#toast.montre{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){.factions{grid-template-columns:1fr}.barre{font-size:12px}.barre span{padding:2px 5px}#barreObjectif{top:84px;font-size:12px}}
</style>
</head>
<body>

<!-- Accueil -->
<section id="accueil" class="ecran">
  <svg class="blason" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4 88 18v30c0 24-17 40-38 48C29 88 12 72 12 48V18z" fill="#1e1a14" stroke="#c9a24a" stroke-width="3"/><path d="M44 20h12v24h20v12H56v30H44V56H24V44h20z" fill="#9b1c1c" stroke="#e6cf8f" stroke-width="1.5"/><path d="M30 78 70 30" stroke="#d5d8dc" stroke-width="5" stroke-linecap="round"/><path d="M26 74l8 8" stroke="#c9a24a" stroke-width="5" stroke-linecap="round"/></svg>
  <h1 class="titre">FERRUM<br>ET FIDES</h1>
  <p class="sousTitre">La croisade des armes légendaires</p>
  <p class="trad">« Le fer et la foi » · 1096-1099</p>
  <span class="demo">DÉMO JOUABLE</span>
  <button class="btn or" id="btnContinuer">▶️ Continuer</button>
  <button class="btn" id="btnNouvelle">⚔️ Nouvelle campagne</button>
  <button class="btn" id="btnRapide">🎯 Bataille rapide</button>
  <button class="btn" id="btnAide">🎮 Commandes</button>
  <div class="options">
    <label>Difficulté <select id="optDiff"><option value="facile">Facile</option><option value="normal">Normal</option><option value="difficile">Difficile</option></select></label>
    <label title="Comme dans Mount & Blade : il faut parer dans la direction de l'attaque"><input type="checkbox" id="optDir"> Parade directionnelle</label>
    <label><input type="checkbox" id="optSon" checked> Son</label>
  </div>
  <p class="lienSite"><a href="../">← Retour au site Les Naufragés</a> · <a href="../confidentialite.html">Confidentialité</a> · <a href="../cookies.html">Cookies</a></p>
</section>

<!-- Création du héros -->
<section id="creation" class="ecran hide">
  <h2>Choisis ton camp</h2>
  <div class="factions">
    <button class="carteFaction actif" data-faction="latins"><div class="ico">✠</div><b>Latins</b><small>Les croisés d'Occident</small></button>
    <button class="carteFaction" data-faction="romains"><div class="ico">☦</div><b>Romains</b><small>L'Empire d'Orient (Byzance)</small></button>
  </div>
  <div id="detailFaction"></div>
  <label class="muted" for="nomHeros">Nom de ton héros</label>
  <input id="nomHeros" class="champ" maxlength="20" autocomplete="off" value="Aymeric">
  <button class="btn or" id="btnCommencer">Commencer l'aventure</button>
  <button class="btn" id="btnRetourCreation">Retour</button>
</section>

<!-- Carte de campagne -->
<section id="carte" class="ecran hide">
  <canvas id="carteCanvas"></canvas>
  <div class="barre">
    <span id="barreDate"></span><span id="barreOr"></span><span id="barreTroupes"></span><span id="barreNiveau"></span>
    <span class="esp"></span>
    <button id="bCompagnie">🛡️<span> Compagnie</span></button><button id="bDiplo">🕊️<span> Royaumes</span></button><button id="bJournal">📜<span> Journal</span></button><button id="bCodex">📖<span> Codex</span></button><button id="bMenu">☰</button>
  </div>
  <div id="barreObjectif"></div>
  <div class="zoom"><button id="zoomPlus" aria-label="Zoomer">+</button><button id="zoomMoins" aria-label="Dézoomer">−</button><button id="recentrer" aria-label="Recentrer">◎</button></div>
  <div id="panneauLieu" class="hide"></div>
</section>

<!-- Vue 3D (batailles, mer, villes) -->
<section id="jeu3d" class="ecran hide">
  <canvas id="vue3d"></canvas>
  <div id="zoneTactile"></div>
  <div id="calqueTextes"></div>
  <div id="hudHaut" class="hud terre combat">
    <div class="jauge"><i id="hudPv"></i><span id="hudPvTxt"></span></div>
    <div class="jauge fine"><i id="hudEnd"></i></div>
    <div id="hudArme"></div>
  </div>
  <div id="hudNaval" class="hud mer">
    <div id="hudNavTxt"></div>
    <div class="jauge"><i id="hudNavPv"></i></div>
    <div id="hudNavEquipage"></div>
    <div class="cooldowns"><div class="cd" id="hudNavTir" title="Volée de carreaux">🏹</div><div class="cd" id="hudNavFeu" title="Feu grégeois">🔥</div></div>
  </div>
  <div id="hudNavJauge" class="hud mer"><div id="hudNavGaz"></div></div>
  <div id="hudInfos" class="hud"><div id="nomLieu3d"></div><div id="hudForces" class="combat"></div><div id="hudOr" class="combat"></div></div>
  <div id="hudBoss" class="hud hide"><div id="hudBossNom"></div><div class="jauge"><i id="hudBossPv"></i></div></div>
  <div id="hudMsg" class="hudMsg"></div>
  <div id="hudDir" class="hudDir hide terre combat"></div>
  <div id="hudPouvoir" class="hud hide terre combat" data-action="pouvoir">✨<span id="hudPouvoirNom"></span></div>
  <div id="hudOrdres" class="hud hide terre combat">
    <button data-ordre="suivre" data-action="ordre1">🚩 1 Suivez-moi</button><button data-ordre="tenir" data-action="ordre2">🛡️ 2 Tenez</button><button data-ordre="charge" data-action="ordre3">⚔️ 3 Chargez</button>
  </div>
  <div id="invite" class="hide"></div>
  <button id="btnPause" aria-label="Pause">⏸</button>
  <div id="joySocle" class="tactileSeul"><div id="joyBouton"></div></div>
  <div id="boutonsTactiles" class="tactileSeul">
    <button class="gros" id="bAttaque" data-action="attaque" aria-label="Frapper / parler">⚔️</button>
    <button id="bBloc" data-tenu="bloc" class="terre combat" aria-label="Parer">🛡️</button>
    <button id="bEsquive" data-action="esquive" class="combat" aria-label="Roulade / tirer">💨</button>
    <button id="bCourir" data-tenu="courir" class="terre" aria-label="Courir">🏃</button>
    <button id="bChanger" data-action="changer" class="combat" aria-label="Changer d'arme / aborder">⇄</button>
    <button id="bOrdre" data-action="ordre" class="terre combat" aria-label="Ordre aux troupes">🚩</button>
  </div>
</section>

<!-- Dialogues -->
<div id="dialogue" class="hide">
  <div class="dlgBoite">
    <div id="dlgPortrait"></div>
    <div class="dlgDroite"><div id="dlgNom"></div><div id="dlgTexte"></div><div id="dlgChoix"></div></div>
    <div id="dlgSuite">▼ clic / espace</div>
  </div>
</div>

<!-- Fenêtre (forge, recrues, cour, journal...) -->
<div id="fenetre" class="hide">
  <div class="fenBoite">
    <div class="fenTete"><h2 id="fenTitre"></h2><button id="fenFermer" aria-label="Fermer">✕</button></div>
    <div id="fenCorps"></div>
  </div>
</div>
<div id="toast"></div>

<script>
// Téléphone ou ordinateur : on adapte les commandes affichées.
document.body.classList.add(window.matchMedia('(pointer: coarse)').matches ? 'tactile' : 'pc');

<script src="../sauvegarde.js" data-jeu="ferrum"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="moteur.js?v=5"></script>
<script src="bataille.js?v=5"></script>

</body>
